name: Auto Post Generator

on:
  schedule:
    # 1時間に1回実行
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci || npm i

      - name: Run (dry)
        run: npm run dry
        env:
          DRY_RUN: "1"
          RSS_URLS: ${{ secrets.RSS_URLS }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          if-no-files-found: warn

