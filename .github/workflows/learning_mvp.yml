name: Learning MVP

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run learning
        run: |
          python apps/learning/cli.py update
      - name: Build job summary
        run: |
          mkdir -p apps/pipeline/data/contents
          python apps/learning/cli.py status > apps/pipeline/data/contents/job_summary.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: learning-output
          path: |
            apps/pipeline/data/state
            apps/pipeline/data/contents/job_summary.txt
